<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Pet Max Blog</title>
<link rel="icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand">
      <img src="/images/logo.png" alt="Pet Max logo">
      <span class="brand-name">PET MAX<span>Tech made simple, tails made happy</span></span>
    </a>
    <nav class="main-nav">
      <a href="/#shop">Shop</a>
      <a href="/#categories">Categories</a>
      <a href="/#about">Why Pet Max</a>
      <a href="/blog" class="active">Blog</a>
      
    </nav>
    <div class="header-actions">
      <button class="icon-btn" onclick="location.href='/'" aria-label="Back to shop">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="blog-post-wrap" id="postWrap">
  <p style="color:var(--ink-soft); text-align:center; padding:60px 0;">Loading…</p>
</main>

<footer class="site-footer">
  <div class="footer-grid">
    <div class="footer-brand">
      <img src="/images/logo.png" alt="Pet Max">
      <p>A Pakistan-based pet supplies store for cat food, treats, litter, grooming and toys.</p>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© <span id="year"></span> Pet Max. Made for cats, run from Lahore.</span>
  </div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

async function loadPost() {
  const slug = location.pathname.split('/blog/')[1];
  const wrap = document.getElementById('postWrap');
  try {
    const res = await fetch(`/api/blog/${slug}`);
    if (!res.ok) throw new Error('not found');
    const post = await res.json();
    document.getElementById('pageTitle').textContent = `${post.title} — Pet Max Blog`;
    wrap.innerHTML = `
      <a href="/blog" class="blog-back-link">← Back to blog</a>
      ${post.has_cover_image ? `<div class="blog-post-cover"><img src="/api/blog/image/${post.id}" alt="${post.title}"></div>` : ''}
      <span class="blog-card-date">${new Date(post.published_at).toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
      <h1>${post.title}</h1>
      <div class="blog-post-content">${post.content || ''}</div>
    `;
  } catch (err) {
    wrap.innerHTML = `<div style="text-align:center; padding:60px 0;"><h1>Post not found</h1><p><a href="/blog">← Back to blog</a></p></div>`;
  }
}
loadPost();
</script>
</body>
</html>
